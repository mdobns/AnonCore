version: "3.9"

# ─── Shared network ─────────────────────────────────────────────────────────
networks:
  anoncore:
    driver: bridge

# ─── Named volumes (data persists across restarts) ──────────────────────────
volumes:
  postgres_data:
  redis_data:

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anoncore
      POSTGRES_PASSWORD: anoncore
      POSTGRES_DB: anoncore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - anoncore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anoncore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - anoncore
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://anoncore:anoncore@db:5432/anoncore
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      VALID_API_KEYS: ${VALID_API_KEYS:-dev-api-key}
      MODERATION_ENABLED: "true"
      MAX_STRIKES: 3
      ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "8000:8000"
    networks:
      - anoncore
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Frontend (React + Vite / Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: ${VITE_API_KEY:-dev-api-key}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - anoncore
